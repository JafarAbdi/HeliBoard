name: Build APK and release

on:
  workflow_dispatch:
  push:
    branches:
      - pixel-voice

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      GRADLE_OPTS: -Dorg.gradle.caching=true
      CMAKE_C_COMPILER_LAUNCHER: /usr/bin/ccache
      CMAKE_CXX_COMPILER_LAUNCHER: /usr/bin/ccache
      NDK_CCACHE: /usr/bin/ccache
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools

      - name: Install ccache
        run: |
          sudo apt-get update
          sudo apt-get install --yes ccache
          printf 'CCACHE_DIR=%s/native-ccache\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Cache native compilation
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/native-ccache
          key: native-ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            native-ccache-${{ runner.os }}-${{ runner.arch }}-

      - name: Install the pinned build toolchain
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' \
            'build-tools;35.0.0' 'ndk;28.0.13004108' 'cmake;3.22.1'
          toolchain="$RUNNER_TEMP/heliboard-toolchain"
          mkdir -p "$toolchain"
          ln -s "$JAVA_HOME" "$toolchain/jdk17"
          ln -s "$ANDROID_HOME" "$toolchain/android-sdk"
          printf 'PIXEL_VOICE_TOOLCHAIN=%s\n' "$toolchain" >> "$GITHUB_ENV"
          printf 'PIXEL_VOICE_MODEL=%s/parakeet-unified-en-0.6b-Q8_0.gguf\n' \
            "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Restore the existing signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo '::error::Set the ANDROID_DEBUG_KEYSTORE_BASE64 repository secret.'
            exit 1
          fi
          mkdir -p "$HOME/.android"
          umask 077
          base64 --decode <<< "$KEYSTORE_BASE64" > "$HOME/.android/debug.keystore"
          printf 'ANDROID_USER_HOME=%s/.android\n' "$HOME" >> "$GITHUB_ENV"

      - name: Download the pinned model for native checks only
        run: |
          curl --fail --location --output "$PIXEL_VOICE_MODEL" \
            'https://huggingface.co/handy-computer/parakeet-unified-en-0.6b-gguf/resolve/7e948f21b7bdbac698d3318db9d350f1096f3b6c/parakeet-unified-en-0.6b-Q8_0.gguf'

      - name: Build and verify the ARM64 APK
        run: scripts/check.sh

      - name: Show native compilation cache statistics
        run: /usr/bin/ccache --show-stats

      - name: Prepare the release assets
        run: |
          mkdir release
          cp app/build/outputs/pixelVoice/arm64-v8a/pixel-voice-arm64-v8a-debug.apk \
            release/HeliBoard.apk
          cd release
          sha256sum HeliBoard.apk > HeliBoard.apk.sha256

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: HeliBoard-ARM64
          path: release/
          if-no-files-found: error

  publish:
    if: github.ref == 'refs/heads/pixel-voice'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: HeliBoard-ARM64
          path: release

      - name: Publish the verified APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: continuous
          BUILD_COMMIT: ${{ github.sha }}
        run: |
          cd release
          sha256sum --check HeliBoard.apk.sha256
          gh release edit "$RELEASE_TAG" --draft=true
          gh release upload "$RELEASE_TAG" HeliBoard.apk HeliBoard.apk.sha256 --clobber
          gh api --method PATCH "repos/$GH_REPO/git/refs/tags/$RELEASE_TAG" \
            -f sha="$BUILD_COMMIT" -F force=true
          gh release edit "$RELEASE_TAG" --draft=false --prerelease \
            --title 'Continuous build' \
            --notes "HeliBoard with local English dictation. ARM64 debug APK; install the model separately. Source: $BUILD_COMMIT"
